version: '3'
services:
  yomii-php:
    container_name : yomii-php
    build : ./php
    volumes:
      - ./php/php.ini:/usr/local/etc/php/php.ini
      - ../public:/var/www/html
    working_dir: /var/www/html

  yomii-nginx:
    container_name: yomii-nginx
    build : ./nginx
    ports:
      - 8001:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ../public:/var/www/html
    depends_on:
      - yomii-php

  yomii-node:
    container_name: yomii-node
    build: ./node
    volumes:
      - ../batch:/app
      - ../data:/data/input
      - ../data/converted:/data/output
    working_dir: /app
    entrypoint: ["sh", "-c", "npm install --silent && node convert.js /data/input /data/output"]
    profiles:
      - batch
