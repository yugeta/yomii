<link rel="stylesheet" href="page/{{page_name}}/css/style.css"/>
<link rel="stylesheet" href="page/{{page_name}}/css/add_dialog.css"/>
<script type="module" src="page/{{page_name}}/js/main.js"></script>

<h2>本棚</h2>

<div class="shelf-tabs">
  <select class="shelf-tab-select">
    <option value="cache">キャッシュ</option>
    <option value="local">ローカル</option>
    <option value="pcloud">pCloud</option>
    <option value="sample">サンプル</option>
  </select>
  <button class="shelf-tab active" data-source="cache">キャッシュ</button>
  <button class="shelf-tab" data-source="local">ローカル</button>
  <button class="shelf-tab" data-source="pcloud">pCloud</button>
  <button class="shelf-tab" data-source="sample">サンプル</button>
  <button class="shelf-tab-add" aria-label="本棚を追加" title="本棚を追加">+</button>
  <div class="shelf-view-toggle">
    <button class="view-btn active" data-view="icon" title="アイコン表示">⊞</button>
    <button class="view-btn" data-view="list" title="リスト表示">☰</button>
  </div>
</div>

<div class='breadcrumps'></div>

<div class="cache-toolbar" style="display:none;">
  <button class="btn-cache-source" disabled>元の場所</button>
  <button class="btn-cache-delete" disabled>選択を削除</button>
  <button class="btn-cache-clear">一括削除</button>
  <span class="cache-info"></span>
</div>

<ul class='lists'></ul>
<div class="shelf-empty" style="display:none;"></div>

<div class="shelf-action-bar">
  <button class="btn-open" disabled>開く</button>
  <button class="btn-cache-add" disabled style="display:none;">キャッシュに入れる</button>
</div>
